name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels:
  - bug
  - needs reproduction
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Threadseer. This is a public form. Do not include customer data, report files, case identifiers, tenant details, credentials, or proprietary field names. Use synthetic data.
  - type: input
    id: version
    attributes:
      label: Threadseer version
      description: Use the PBIVIZ filename or the Marketplace/version details supplied with the visual. Threadseer does not currently expose an in-visual About page.
      placeholder: 0.1.0.110 (from the PBIVIZ filename)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Power BI environment
      options:
        - Power BI Desktop
        - Power BI Service
        - Embedded or another host
    validations:
      required: true
  - type: input
    id: power_bi_version
    attributes:
      label: Power BI version
      description: Use the version shown by Power BI Desktop, or enter Power BI Service and the date you observed the problem.
      placeholder: Desktop 2.x.x or Power BI Service, August 2026
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic field names and data only.
      placeholder: |
        1. Add Threadseer to a blank report.
        2. Map synthetic fields...
        3. Select Analyze...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential, personal, customer, tenant, credential, and proprietary information from this issue and any attachments.
          required: true
        - label: I can reproduce this with synthetic data, or I explained why no sample is attached.
          required: true
